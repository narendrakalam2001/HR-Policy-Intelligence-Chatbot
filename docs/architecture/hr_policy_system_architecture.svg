<svg width="100%" viewBox="0 0 1100 700" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<title>HR Policy Intelligence Chatbot — System Architecture</title>
<desc>5-layer RAG system architecture: Data, Retrieval, Generation, Serving, and Deployment</desc>
